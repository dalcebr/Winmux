<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0a1a4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Meu PC</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%2300a2ff' d='M0 0h7.5v7.5H0zM8.5 0H16v7.5H8.5zM0 8.5h7.5V16H0zM8.5 8.5H16V16H8.5z'/%3E%3C/svg%3E">
<style>
:root{
  --tb:48px;
  --sb:env(safe-area-inset-bottom,0px);
  --fg:#fff;
  --mut:rgba(255,255,255,.62);
  --glass:rgba(28,30,42,.72);
  --glass-solid:rgba(32,34,46,.96);
  --line:rgba(255,255,255,.09);
  --hover:rgba(255,255,255,.09);
  --press:rgba(255,255,255,.05);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#06103a}
body{
  font:400 14px/1.3 "Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  color:var(--fg);user-select:none;-webkit-user-select:none;
}
#wp{position:fixed;inset:0;width:100%;height:100%;display:block}

#tb{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  height:calc(var(--tb) + var(--sb));padding-bottom:var(--sb);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  background:var(--glass);border-top:1px solid var(--line);
}
@supports((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #tb{background:rgba(28,30,42,.55);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}
}
#mid{display:flex;gap:4px;justify-content:center}
.ib{
  position:relative;width:44px;height:40px;border:0;border-radius:6px;background:none;color:var(--fg);
  display:grid;place-items:center;cursor:default;transition:background .12s,transform .1s;
}
.ib:hover{background:var(--hover)}
.ib:active{background:var(--press)}
.ib:active svg{transform:scale(.88)}
.ib svg{width:22px;height:22px;transition:transform .1s}
.ib[aria-expanded=true]{background:var(--hover)}
.ib[aria-expanded=true]::after{
  content:"";position:absolute;bottom:2px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:#4cc2ff;
}
.ib:focus-visible,#q:focus-visible{outline:2px solid #4cc2ff;outline-offset:1px}

#clock{
  justify-self:end;margin-right:8px;padding:4px 10px;border-radius:6px;
  text-align:right;font-size:12px;line-height:1.25;white-space:nowrap;cursor:default;
}
#clock:hover{background:var(--hover)}
#clock b{display:block;font-weight:400}

#panel{
  position:fixed;z-index:9;left:50%;
  bottom:calc(var(--tb) + var(--sb) + 12px);
  width:min(640px,calc(100vw - 24px));height:min(560px,calc(100dvh - var(--tb) - var(--sb) - 36px));
  padding:24px;display:flex;flex-direction:column;
  background:var(--glass-solid);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 16px 48px rgba(0,0,0,.45);
  opacity:0;visibility:hidden;transform:translate(-50%,16px);
  transition:opacity .16s ease,transform .16s ease,visibility 0s .16s;
}
@supports((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  #panel{background:rgba(32,34,46,.82);-webkit-backdrop-filter:blur(40px) saturate(1.5);backdrop-filter:blur(40px) saturate(1.5)}
}
#panel.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
#sf{
  display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:20px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);border-bottom-color:#4cc2ff;
}
#sf svg{width:16px;height:16px;flex:none;opacity:.7}
#q{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:14px;outline:0;user-select:text;-webkit-user-select:text}
#q::placeholder{color:var(--mut)}
#empty{flex:1;display:grid;place-content:center;text-align:center;color:var(--mut);gap:4px}
#empty strong{font-weight:600;font-size:16px;color:var(--fg)}

@media (pointer:coarse){
  :root{--tb:52px}
  .ib{width:48px;height:44px}
  #q{font-size:16px}
}
@media (max-width:420px){
  #clock{margin-right:2px;padding:4px 6px;font-size:11px}
  .ib{width:42px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
#tray{justify-self:end;display:flex;align-items:center;gap:2px}
#tray #clock{margin:0 6px 0 0;justify-self:auto}
#fs{width:38px}
.ib.run::after,.ib.act::after{content:"";position:absolute;bottom:2px;left:50%;width:6px;height:3px;margin-left:-3px;border-radius:2px;background:#9aa3b5}
.ib.act::after{width:14px;margin-left:-7px;background:#4cc2ff}
#apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:4px;margin-top:20px;align-content:start;overflow:auto}
.tile{display:grid;justify-items:center;gap:6px;padding:12px 4px;border:0;border-radius:6px;background:none;color:var(--fg);font:inherit;font-size:12px;cursor:default}
.tile:hover{background:var(--hover)}
.tile svg{width:36px;height:36px}
#nores{margin:auto;color:var(--mut)}
#wins{position:fixed;inset:0;z-index:5;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;min-width:320px;min-height:240px;background:#202431;border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 40px rgba(0,0,0,.5);overflow:hidden}
.win.hid{display:none}
.win.max{left:0!important;top:0!important;width:auto!important;height:auto!important;right:0;bottom:calc(var(--tb) + var(--sb));border-radius:0}
.wt{display:flex;align-items:center;flex:none;height:36px;padding-left:12px;gap:8px;background:rgba(255,255,255,.05);font-size:12px;touch-action:none}
.wt>svg{width:16px;height:16px}
.wt>span{flex:1}
.wt button{width:46px;height:100%;border:0;background:none;color:inherit;display:grid;place-items:center}
.wt button svg{width:14px;height:14px}
.wt button:hover{background:var(--hover)}
.wt .b-x:hover{background:#c42b1c}
.wb{flex:1;min-height:0;position:relative}
.rz{position:absolute;z-index:6;touch-action:none}
.rz[data-d=n],.rz[data-d=s]{left:10px;right:10px;height:6px;cursor:ns-resize}
.rz[data-d=e],.rz[data-d=w]{top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz[data-d=n]{top:0}.rz[data-d=s]{bottom:0}.rz[data-d=e]{right:0}.rz[data-d=w]{left:0}
.rz[data-d=ne],.rz[data-d=nw],.rz[data-d=se],.rz[data-d=sw]{width:14px;height:14px}
.rz[data-d=ne]{top:0;right:0;cursor:nesw-resize}.rz[data-d=sw]{bottom:0;left:0;cursor:nesw-resize}
.rz[data-d=nw]{top:0;left:0;cursor:nwse-resize}.rz[data-d=se]{bottom:0;right:0;cursor:nwse-resize}
.win.max .rz{display:none}
@media (pointer:coarse){
  .rz[data-d=n],.rz[data-d=s]{height:14px}.rz[data-d=e],.rz[data-d=w]{width:14px}
  .rz[data-d=ne],.rz[data-d=nw],.rz[data-d=se],.rz[data-d=sw]{width:24px;height:24px}
}
@media (max-width:700px){
  .rz{display:none}
  .win{left:0!important;top:0!important;width:auto!important;height:auto!important;right:0;bottom:calc(var(--tb) + var(--sb));border-radius:0;border:0}
  .b-max{display:none}
}
#pf{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
#pf button{height:36px;padding:0 16px;border:0;border-radius:6px;background:none;color:var(--fg);font:inherit;cursor:default}
#pf button:hover{background:var(--hover)}
#lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(5,12,45,.45);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px)}
.lk{display:grid;justify-items:center;gap:14px;width:min(320px,calc(100vw - 48px))}
.av{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.av svg{width:52px;height:52px}
.lk b{font-size:22px;font-weight:600}
.lf{display:flex;width:100%;background:rgba(255,255,255,.14);border:1px solid var(--line);border-bottom:2px solid #4cc2ff;border-radius:6px;overflow:hidden}
#lp{flex:1;min-width:0;height:40px;padding:0 12px;border:0;background:none;color:#fff;font:inherit;font-size:16px;outline:0;user-select:text;-webkit-user-select:text}
#lp::placeholder{color:var(--mut)}
#lg{width:44px;border:0;background:none;color:#fff;font-size:18px}
#le{min-height:18px;color:#ffb4ab;font-size:12px;text-align:center}
</style>
</head>
<body>

<svg id="wp" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020a2e"/><stop offset=".45" stop-color="#0a2a9a"/>
      <stop offset=".8" stop-color="#1b74ff"/><stop offset="1" stop-color="#7fd3ff"/>
    </linearGradient>
    <linearGradient id="pa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2cc4" stop-opacity=".95"/><stop offset="1" stop-color="#58c4ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="pb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050f5a" stop-opacity=".95"/><stop offset="1" stop-color="#2f8cff" stop-opacity=".85"/>
    </linearGradient>
    <linearGradient id="pc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3da5ff" stop-opacity=".55"/><stop offset="1" stop-color="#d4f1ff" stop-opacity=".75"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8f8ff" stop-opacity=".95"/><stop offset=".35" stop-color="#7fd3ff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#1b74ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#010617" stop-opacity=".7"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g transform="translate(800 440)">
    <g fill="url(#pb)">
      <ellipse cx="230" rx="440" ry="150" transform="rotate(20)"/>
      <ellipse cx="230" rx="440" ry="150" transform="rotate(140)"/>
      <ellipse cx="230" rx="440" ry="150" transform="rotate(260)"/>
    </g>
    <g fill="url(#pa)">
      <ellipse cx="200" rx="400" ry="130" transform="rotate(80)"/>
      <ellipse cx="200" rx="400" ry="130" transform="rotate(200)"/>
      <ellipse cx="200" rx="400" ry="130" transform="rotate(320)"/>
    </g>
    <g fill="url(#pc)">
      <ellipse cx="150" rx="260" ry="70" transform="rotate(50)"/>
      <ellipse cx="150" rx="260" ry="70" transform="rotate(170)"/>
      <ellipse cx="150" rx="260" ry="70" transform="rotate(290)"/>
    </g>
    <circle r="260" fill="url(#glow)"/>
  </g>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>

<div id="panel" role="dialog" aria-label="Iniciar">
  <div id="sf">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.9-4.9"/></svg>
    <input id="q" type="text" placeholder="Pesquisar" autocomplete="off" autocapitalize="off" spellcheck="false">
  </div>
  <div id="apps"></div>
  <div id="nores" hidden>Nenhum resultado</div>
  <div id="pf"><button id="lo">Sair</button></div>
</div>

<div id="wins"></div>

<nav id="tb">
  <span></span>
  <div id="mid">
    <button class="ib" id="bs" aria-label="Iniciar" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24"><defs><linearGradient id="wl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd0ff"/><stop offset="1" stop-color="#0a72f0"/></linearGradient></defs><path fill="url(#wl)" d="M2 2h9.5v9.5H2zM12.5 2H22v9.5h-9.5zM2 12.5h9.5V22H2zM12.5 12.5H22V22h-9.5z"/></svg>
    </button>
    <button class="ib" id="bq" aria-label="Pesquisar" aria-controls="panel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.9-4.9"/></svg>
    </button>
  </div>
  <div id="tray">
    <button class="ib" id="fs" aria-label="Tela cheia" title="Tela cheia" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path id="fsp" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div id="clock"><b id="t"></b><b id="d"></b></div>
  </div>
</nav>

<div id="lock" hidden>
  <div class="lk">
    <div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></div>
    <b>Meu PC</b>
    <div class="lf"><input id="lp" type="password" placeholder="Senha" autocomplete="current-password"><button id="lg" aria-label="Entrar">→</button></div>
    <div id="le"></div>
  </div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i)},
      panel=$("panel"),bs=$("bs"),bq=$("bq"),q=$("q"),mid=$("mid"),wins=$("wins"),grid=$("apps"),nores=$("nores"),
      ft=new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit"}),
      fd=new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"}),
      timer,run={},zi=1;

  /* relógio */
  function tick(){
    clearTimeout(timer);
    var n=new Date();
    $("t").textContent=ft.format(n);
    $("d").textContent=fd.format(n);
    timer=setTimeout(tick,60000-(n.getSeconds()*1000+n.getMilliseconds())+30);
  }
  tick();
  document.addEventListener("visibilitychange",function(){if(!document.hidden)tick()});

  /* apps */
  var ico=function(d){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+d+'"/></svg>'};
  var APPS=[{id:"fm",name:"Arquivos",src:"fm.js?v=4",
    icon:'<svg viewBox="0 0 24 24"><path fill="#e0a82e" d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v1H2z"/><path fill="#ffd36b" d="M2 9h20v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>'},
    {id:"term",name:"Terminal",src:"term.js?v=1",
    icon:'<svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="3" fill="#1c2030"/><path d="M2 6a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1H2z" fill="#3b4366"/><path d="M6 11.5l3.2 2.5L6 16.5" fill="none" stroke="#6ee7a8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.5 17h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>'},
    {id:"git",name:"Git",src:"git.js?v=1",
    icon:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="4" fill="#f05133"/><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M8 6.5v11M8 9.5c0 3 8 1 8 5"/></g><g fill="#fff"><circle cx="8" cy="6.5" r="2"/><circle cx="8" cy="17.5" r="2"/><circle cx="16" cy="14.5" r="2"/></g></svg>'},
    {id:"ai",name:"Assistente IA",src:"ai.js?v=1",
    icon:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="6" fill="#4d6bfe"/><path d="M12 5.5l1.6 4.1 4.1 1.6-4.1 1.6L12 17l-1.6-4.2-4.1-1.6 4.1-1.6z" fill="#fff"/><circle cx="17.5" cy="6.5" r="1.3" fill="#bcd0ff"/></svg>'},
    {id:"ide",name:"Código",src:"ide.js?v=1",
    icon:'<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#1f6feb"/><path d="M9.5 8 5.5 12l4 4M14.5 8l4 4-4 4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'}];

  APPS.forEach(function(a){
    var b=document.createElement("button");
    b.className="tile";b.innerHTML=a.icon+"<span>"+a.name+"</span>";
    b.onclick=function(){close();openApp(a)};
    a.tile=b;grid.appendChild(b);
  });
  function filter(){
    var v=q.value.trim().toLowerCase(),n=0;
    APPS.forEach(function(a){var m=a.name.toLowerCase().indexOf(v)>-1;a.tile.hidden=!m;if(m)n++});
    nores.hidden=n>0;
  }
  q.addEventListener("input",filter);
  q.addEventListener("keydown",function(e){
    if(e.key==="Enter"){var a=APPS.filter(function(a){return!a.tile.hidden})[0];if(a)a.tile.click()}
  });

  function show(r){r.el.classList.remove("hid");r.btn.classList.add("act");r.el.style.zIndex=++zi}
  function hide(r){r.el.classList.add("hid");r.btn.classList.remove("act")}

  function openApp(a){
    if(run[a.id]){show(run[a.id]);return}
    var el=document.createElement("div"),
        W=Math.min(880,innerWidth-40),H=Math.min(560,innerHeight-100),n=Object.keys(run).length*28;
    el.className="win";
    el.style.cssText="width:"+W+"px;height:"+H+"px;left:"+Math.round((innerWidth-W)/2+n)+"px;top:"+Math.round((innerHeight-H-52)/2+n)+"px";
    el.innerHTML='<div class="wt">'+a.icon+'<span>'+a.name+'</span>'+
      '<button class="b-min" aria-label="Minimizar">'+ico("M5 12h14")+'</button>'+
      '<button class="b-max" aria-label="Maximizar">'+ico("M5 5h14v14H5z")+'</button>'+
      '<button class="b-x" aria-label="Fechar">'+ico("M6 6l12 12M18 6L6 18")+'</button></div><div class="wb"></div>';
    var btn=document.createElement("button");
    btn.className="ib run";btn.title=a.name;btn.innerHTML=a.icon;mid.appendChild(btn);
    var r=run[a.id]={el:el,btn:btn},wt=el.firstChild,body=el.lastChild;
    wins.appendChild(el);show(r);

    btn.onclick=function(){close();el.classList.contains("hid")?show(r):hide(r)};
    el.addEventListener("pointerdown",function(){el.style.zIndex=++zi});
    wt.querySelector(".b-min").onclick=function(){hide(r)};
    wt.querySelector(".b-max").onclick=function(){el.classList.toggle("max")};
    wt.querySelector(".b-x").onclick=function(){if(r.cleanup)r.cleanup();el.remove();btn.remove();delete run[a.id]};
    wt.addEventListener("dblclick",function(e){if(!e.target.closest("button"))el.classList.toggle("max")});
    wt.addEventListener("pointerdown",function(e){
      if(e.target.closest("button")||el.classList.contains("max")||innerWidth<=700)return;
      var b=el.getBoundingClientRect(),dx=e.clientX-b.left,dy=e.clientY-b.top;
      wt.setPointerCapture(e.pointerId);
      function mv(e){
        el.style.left=Math.max(80-el.offsetWidth,Math.min(innerWidth-80,e.clientX-dx))+"px";
        el.style.top=Math.max(0,Math.min(innerHeight-90,e.clientY-dy))+"px";
      }
      function up(){wt.removeEventListener("pointermove",mv);wt.removeEventListener("pointerup",up)}
      wt.addEventListener("pointermove",mv);wt.addEventListener("pointerup",up);
    });

    /* redimensionar pelas bordas e cantos */
    ["n","s","e","w","ne","nw","se","sw"].forEach(function(d){
      var h=document.createElement("div");h.className="rz";h.dataset.d=d;el.appendChild(h);
      h.addEventListener("pointerdown",function(e){
        if(e.button||el.classList.contains("max")||innerWidth<=700)return;
        e.preventDefault();e.stopPropagation();el.style.zIndex=++zi;
        var b=el.getBoundingClientRect(),cs=getComputedStyle(el),minW=parseFloat(cs.minWidth)||320,minH=parseFloat(cs.minHeight)||240,
            x0=e.clientX,y0=e.clientY,L=b.left,T=b.top,Wd=b.width,Ht=b.height,maxB=innerHeight-(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tb"))||48);
        h.setPointerCapture(e.pointerId);
        function mv(e){
          var dx=e.clientX-x0,dy=e.clientY-y0,l=L,t=T,w=Wd,hh=Ht;
          if(d.indexOf("e")>-1)w=Math.min(innerWidth-L,Math.max(minW,Wd+dx));
          if(d.indexOf("s")>-1)hh=Math.min(maxB-T,Math.max(minH,Ht+dy));
          if(d.indexOf("w")>-1){w=Math.max(minW,Math.min(Wd-dx,L+Wd));l=L+Wd-w}
          if(d.indexOf("n")>-1){hh=Math.max(minH,Math.min(Ht-dy,T+Ht));t=T+Ht-hh}
          el.style.left=l+"px";el.style.top=t+"px";el.style.width=w+"px";el.style.height=hh+"px";
        }
        function up(){
          h.removeEventListener("pointermove",mv);h.removeEventListener("pointerup",up);h.removeEventListener("pointercancel",up);
          window.dispatchEvent(new Event("resize"));
        }
        h.addEventListener("pointermove",mv);h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up);
      });
    });

    var start=function(){var c=window["App_"+a.id](body);if(typeof c==="function")r.cleanup=c};
    if(window["App_"+a.id])start();
    else{
      var s=document.createElement("script");s.src=a.src;s.onload=start;
      s.onerror=function(){body.textContent="Não foi possível carregar o app."};
      document.head.appendChild(s);
    }
  }

  /* painel iniciar / pesquisa */
  function isOpen(){return panel.classList.contains("on")}
  function open(focus){
    panel.classList.add("on");bs.setAttribute("aria-expanded","true");
    if(focus)q.focus({preventScroll:true});
  }
  function close(){
    panel.classList.remove("on");bs.setAttribute("aria-expanded","false");
    q.blur();q.value="";filter();
  }
  bs.addEventListener("click",function(){isOpen()?close():open(false)});
  bq.addEventListener("click",function(){isOpen()&&document.activeElement===q?close():open(true)});
  document.addEventListener("pointerdown",function(e){
    if(isOpen()&&!panel.contains(e.target)&&!bs.contains(e.target)&&!bq.contains(e.target))close();
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
  document.addEventListener("contextmenu",function(e){if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});

  /* bloqueio */
  var lk=$("lock"),lp=$("lp"),le=$("le"),of=window.fetch;
  function lockUI(on){lk.hidden=!on;if(on){close();le.textContent="";setTimeout(function(){lp.focus()},50)}}
  window.fetch=function(){
    return of.apply(this,arguments).then(function(r){
      if(r.status===401&&r.url.indexOf("/api/login")<0&&r.url.indexOf("/api/auth")<0)lockUI(true);
      return r;
    });
  };
  of("/api/auth").then(function(r){return r.json()}).then(function(j){if(!j.ok)lockUI(true)}).catch(function(){});
  function login(){
    le.textContent="";
    of("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({p:lp.value})})
      .then(function(r){return r.json().then(function(j){if(r.ok)location.reload();else le.textContent=j.e||"Erro"})})
      .catch(function(){le.textContent="Falha de conexão"});
  }
  $("lg").onclick=login;
  lp.addEventListener("keydown",function(e){if(e.key==="Enter")login()});
  $("lo").onclick=function(){of("/api/logout",{method:"POST"}).then(function(){location.reload()})};

  /* tela cheia */
  var fs=$("fs"),de=document.documentElement,
      rq=de.requestFullscreen||de.webkitRequestFullscreen,
      ex=document.exitFullscreen||document.webkitExitFullscreen,
      cur=function(){return document.fullscreenElement||document.webkitFullscreenElement};
  if(rq){
    fs.hidden=false;
    fs.onclick=function(){cur()?ex.call(document):rq.call(de,{navigationUI:"hide"})};
    var sync=function(){
      var on=!!cur();
      $("fsp").setAttribute("d",on?"M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5":"M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5");
      fs.title=fs["aria-label"]=on?"Sair da tela cheia":"Tela cheia";
    };
    document.addEventListener("fullscreenchange",sync);
    document.addEventListener("webkitfullscreenchange",sync);
  }
})();
</script>
